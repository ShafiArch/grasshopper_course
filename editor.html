<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Course editor | Grasshopper Workshop</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/editor.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('grasshopper_course:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect class="bm-body" x="7" y="9" width="18" height="14" rx="3.5"/>
          <circle class="bm-nub" cx="7" cy="16" r="3"/>
          <circle class="bm-nub" cx="25" cy="16" r="3"/>
        </svg>
        <span class="brand-name">Course editor</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="./">View the site</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap editor">
    <div id="editor"></div>
  </main>

  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <dialog class="dialog" id="dialog"></dialog>
  <div id="probe" aria-hidden="true"></div>

  <script src="course.js"></script>
  <script src="assets/editor.js"></script>
</body>
</html>
